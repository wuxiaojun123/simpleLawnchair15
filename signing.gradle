def manKey = [
        store_file    : new File(rootProject.projectDir, "lawnchair.jks").absolutePath,
        key_alias     : "launcher",
        store_password: "launcher666",
        key_password  : "launcher666",
]

def signings = manKey

// set signings to all buildType in project
// apply this gradle in project

if (hasProperty('android')) {

    def releaseConfig = android.signingConfigs.findByName("release")
    if (releaseConfig == null) {
        releaseConfig = android.signingConfigs.create("release")
        println("create release sign!")
    }

    releaseConfig.storeFile = new File(signings.store_file)
    releaseConfig.storePassword = signings.store_password
    releaseConfig.keyAlias = signings.key_alias
    releaseConfig.keyPassword = signings.key_password

    android.buildTypes.all { it ->
        println("setting build type:" + it.name)
        it.signingConfig = android.signingConfigs.release
    }

    println 'signing set.'
}
